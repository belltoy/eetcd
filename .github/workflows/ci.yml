name: Intergration Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Erlang/OTP ${{matrix.otp}}
    strategy:
      matrix:
        otp: ['27.0', '28.0', '29.0']

    services:
      etcd0:
        image: quay.io/coreos/etcd:v3.5.10
        env:
          ETCD_NAME: etcd0
          ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd0:2380
          ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
          ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-1
          ETCD_INITIAL_CLUSTER: etcd0=http://etcd0:2380,etcd1=http://etcd1:2480,etcd2=http://etcd2:2580
          ETCD_INITIAL_CLUSTER_STATE: new
        ports:
          - 2379:2379
          - 2380:2380
      etcd1:
        image: quay.io/coreos/etcd:v3.5.10
        env:
          ETCD_NAME: etcd1
          ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2480
          ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2480
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2479
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2479
          ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-1
          ETCD_INITIAL_CLUSTER: etcd0=http://etcd0:2380,etcd1=http://etcd1:2480,etcd2=http://etcd2:2580
          ETCD_INITIAL_CLUSTER_STATE: new
        ports:
          - 2479:2479
          - 2480:2480
      etcd2:
        image: quay.io/coreos/etcd:v3.5.10
        env:
          ETCD_NAME: etcd2
          ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2580
          ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2580
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2579
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2579
          ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-1
          ETCD_INITIAL_CLUSTER: etcd0=http://etcd0:2380,etcd1=http://etcd1:2480,etcd2=http://etcd2:2580
          ETCD_INITIAL_CLUSTER_STATE: new
        ports:
          - 2579:2579
          - 2580:2580

    steps:
      - uses: actions/checkout@v4
      - name: Wait for etcd cluster
        timeout-minutes: 6
        env:
          ETCD0: ${{ job.services.etcd0.id }}
          ETCD1: ${{ job.services.etcd1.id }}
          ETCD2: ${{ job.services.etcd2.id }}
        # The etcd image has no shell, so Docker's --health-cmd cannot run in it.
        run: |
          health() {
            docker exec "$1" etcdctl endpoint health \
              --endpoints "http://127.0.0.1:$2" --command-timeout=3s
          }
          for attempt in {1..30}; do
            echo "Checking etcd cluster (attempt $attempt/30)"
            if health "$ETCD0" 2379 && health "$ETCD1" 2479 && health "$ETCD2" 2579; then
              exit 0
            fi
            sleep 2
          done
          for container in "$ETCD0" "$ETCD1" "$ETCD2"; do
            docker logs "$container" || true
          done
          exit 1
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: OTP-${{matrix.otp}}
          rebar3-version: '3.26.0'
          version-type: strict
          hexpm-mirrors: |
            https://cdn.jsdelivr.net/hex
            https://builds.hex.pm
      - run: rebar3 do xref, dialyzer, ct -v -c, cover -v
        env:
          TERM: xterm-color
